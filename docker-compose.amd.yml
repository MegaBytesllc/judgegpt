# JudgeGPT — AMD ROCm overlay
#
# Requirements:
#   - ROCm drivers installed: https://rocm.docs.amd.com/en/latest/
#   - Supported GPU: RX 5000+, RX 6000+, RX 7000+, RX 9000+, Instinct MI series
#
# Troubleshoot:
#   ./start.sh gpu-info   ← shows detected GPU + gfx target
#
# If Ollama still falls back to CPU, override the gfx version by setting
# HSA_OVERRIDE_GFX_VERSION in your shell before running ./start.sh up:
#
#   RDNA 2 (RX 6000):   export HSA_OVERRIDE_GFX_VERSION=10.3.0
#   RDNA 3 (RX 7000):   export HSA_OVERRIDE_GFX_VERSION=11.0.0
#   RDNA 4 (RX 9000):   export HSA_OVERRIDE_GFX_VERSION=12.0.1
#
# Works on: Linux with AMD GPU + ROCm drivers

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: judgegpt-ollama
    ports:
      - "11435:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_GPU_OVERHEAD=0
      # gfx1201 = RDNA 4 (RX 9070 / RX 9070 XT).  ROCm requires this override
      # because the ollama:rocm image doesn't auto-recognise gfx1201 yet.
      # Shell override still wins: export HSA_OVERRIDE_GFX_VERSION=x.y.z
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-12.0.1}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # group_add not needed — ollama/ollama:rocm runs as root, which has
    # full device access regardless of group membership. The device mounts
    # above are sufficient for ROCm to reach /dev/kfd and /dev/dri.
    networks:
      - judgegpt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orchestrator:
    environment:
      - NATIVE_OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
