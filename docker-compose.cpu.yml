# JudgeGPT — CPU fallback overlay
#
# No GPU required — runs on any machine with Docker.
# Performance is limited: expect 2-8 t/s for 7B models.
# Recommended for testing, CI, or machines without a supported GPU.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: judgegpt-ollama
    ports:
      - "11435:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_THREAD=8      # tune to your CPU core count
    networks:
      - judgegpt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orchestrator:
    environment:
      - NATIVE_OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
