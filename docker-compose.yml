version: "3.9"

# JudgeGPT — Base Compose File
#
# Do NOT run this file directly.
# Use ./start.sh which auto-detects your GPU and selects the right overlay:
#
#   ./start.sh up              # auto-detect (mac / nvidia / amd / cpu)
#   ./start.sh up --platform nvidia
#   ./start.sh up --platform amd
#   ./start.sh up --platform cpu
#
# GPU is provided by the platform overlay (docker-compose.<platform>.yml).
# NATIVE_OLLAMA_HOST is injected by the overlay — do not set it here.

services:

  # ── Orchestrator ──────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: judgegpt-orchestrator
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ollama:/root/.ollama
      - ./orchestrator/main.py:/app/main.py
    environment:
      - OLLAMA_MODELS_PATH=${HOME}/.ollama
      - JUDGE_MODEL=qwen2.5:7b
      - DOCKER_NETWORK=judgegpt-net
      - OLLAMA_BASE_PORT=11501
      - OLLAMA_IMAGE=ollama/ollama:latest
      # NATIVE_OLLAMA_HOST is injected by the platform overlay
    networks:
      - judgegpt-net
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: judgegpt-frontend
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    networks:
      - judgegpt-net
    restart: unless-stopped

networks:
  judgegpt-net:
    name: judgegpt-net
    driver: bridge
