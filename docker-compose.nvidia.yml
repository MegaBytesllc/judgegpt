# JudgeGPT — NVIDIA GPU overlay
#
# Requirements:
#   - nvidia-container-toolkit installed
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   - Docker configured to use nvidia runtime:
#     sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
#
# Works on: Linux, Windows WSL2 with NVIDIA GPU

services:
  ollama:
    image: ollama/ollama:latest
    container_name: judgegpt-ollama
    ports:
      - "11435:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - judgegpt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orchestrator:
    environment:
      - NATIVE_OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
